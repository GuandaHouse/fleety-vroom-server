app = "fleety-vroom"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

# VROOM aponta pro OSRM próprio em outro app Fly.io na mesma região (GRU).
# Endpoint configurado no config.yml (copiado pra /conf no Dockerfile).
# VROOM_ROUTER=osrm (env) confirma o backend; host/port vêm do config.yml.
[env]
  VROOM_ROUTER = "osrm"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  # Imagem oficial não carrega mapa em RAM (só faz HTTP pro OSRM público).
  # 512MB chega de sobra. Custo idle scale-to-zero ~$0/mês.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    type = "http"
    port = 3000
    path = "/health"
    interval = "30s"
    timeout = "5s"
