cliArgs:
  geometry: false
  planmode: false
  threads: 4
  explore: 5
  limit: '1mb'
  logdir: '..'
  logsize: '100M'
  maxlocations: 1000
  maxvehicles: 200
  override: ['c', 'g', 'l', 't', 'x']
  path: ''
  port: 3000
  router: 'osrm'
  timeout: 300000
  baseurl: '/'
routingServers:
  osrm:
    car:
      # OSRM próprio em outro app Fly.io na mesma org/região (GRU).
      # .flycast é o domínio interno do Fly — HTTP apenas, latência <5ms,
      # sem custo de bandwidth. VROOM não suporta HTTPS então essa rota
      # interna é a única forma de usar OSRM remoto.
      host: 'fleety-osrm.flycast'
      port: '5000'
