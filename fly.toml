app = "fleety-vroom"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  # [vm-4gb 2026-05-09] Brasil completo carregado em RAM precisa ~2.5-3GB.
  # 4GB cabe folgado. shared-cpu-1x 4GB = ~$10.70/mês teto, mas com
  # auto_stop_machines + min_machines_running=0, custo real estimado
  # ~$1-5/mês (idle 99% do tempo).
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    type = "http"
    port = 3000
    path = "/health"
    interval = "30s"
    timeout = "5s"
