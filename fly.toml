app = "fleety-vroom"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

# VROOM aponta pra OSRM público — sem hospedar OSRM próprio (por ora).
# Trocar pra http://fleety-osrm.flycast:5000 quando subirmos OSRM Brasil
# próprio em outro app Fly.io.
[env]
  VROOM_ROUTER = "osrm"
  OSRM_HOST = "router.project-osrm.org"
  OSRM_PORT = "443"
  OSRM_PROFILE = "driving"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  # Imagem oficial não carrega mapa em RAM (só faz HTTP pro OSRM público).
  # 512MB chega de sobra. Custo idle scale-to-zero ~$0/mês.
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[checks]
  [checks.health]
    type = "http"
    port = 3000
    path = "/health"
    interval = "30s"
    timeout = "5s"
