name: Deploy VROOM to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy VROOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # osrm-partition do Brasil completo passa de 16GB. ubuntu-latest free
      # tem ~84GB em /, então criamos 16GB de swap pra OS não matar o build
      # com SIGKILL (exit 137).
      - name: Increase swap to 16GB
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Deploy VROOM to Fly.io
        run: flyctl deploy --local-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          DOCKER_BUILDKIT: '1'
